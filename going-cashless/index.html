    <script>
(function () {
  var parts = location.pathname.split("/").filter(Boolean);
  var folder = parts[parts.length - 1] === "index.html"
    ? parts[parts.length - 2]
    : parts[parts.length - 1];
  var SONG = "rel_" + folder;

  var ICONS = {
    youtube: "si-youtube",
    rumble: "si-rumble",
    applemusic: "si-applemusic",
    spotify: "si-spotify",
    bandcamp: "si-bandcamp",
    amazonmusic: "si-amazonmusic"
  };

  fetch("links.json")
    .then(function (r) {
      if (!r.ok) throw new Error("links.json " + r.status);
      return r.json();
    })
    .then(function (data) {
      var song = data[SONG];
      if (!song) throw new Error("missing " + SONG);

      document.title = song.title;

      function setMeta(sel, attr, val) {
        var el = document.querySelector(sel);
        if (el && val != null) el.setAttribute(attr, val);
      }

      setMeta('meta[name="description"]', "content", song.description);
      setMeta('meta[name="keywords"]', "content", song.keywords);
      setMeta('meta[property="og:title"]', "content", song.title);
      setMeta('meta[property="og:description"]', "content", song.description);
      setMeta('meta[property="og:site_name"]', "content", song.title);

      // Share/social preview: plain file path from JSON (no CSS/filters).
      if (song.share_image) {
        setMeta('meta[property="og:image"]', "content", song.share_image);
        setMeta('meta[property="twitter:image"]', "content", song.share_image);
      }

var cover = document.querySelector("#image01 img");
var hint = document.querySelector("#image01 .cover-fill-hint");
if (cover && song.cover && song.cover.file) {
  // Real cover path: swap in art and drop the fill-in hint.
  cover.dataset.src = song.cover.file;
  cover.src = song.cover.file;
  cover.title = song.cover.title || song.title;
  if (hint) hint.remove();
}

if (song.background && song.background.file) {
  document.documentElement.style.setProperty(
    "--page-bg",
    "url('" + song.background.file + "')"
  );
  var mobileBg = song.background.file_mobile || song.background.file;
  document.documentElement.style.setProperty(
    "--page-bg-mobile",
    "url('" + mobileBg + "')"
  );
}

var heading = document.querySelector("#text45 strong");
if (heading) {
  heading.textContent = song.name || "Song";
}
        
      var list = document.getElementById("buttons01");
      if (!list || !song.links) return;
      list.innerHTML = "";

      song.links.forEach(function (link, i) {
        var iconClass = ICONS[link.icon] || "";
        var n = String(i + 1).padStart(2, "0");
        var li = document.createElement("li");
        var icon = iconClass
          ? '<i class="si ' + iconClass + '" aria-hidden="true"></i>'
          : "";
        li.innerHTML =
          '<a href="' + link.url + '" class="n' + n + '" role="button" target="_blank" rel="noopener">' +
          icon +
          '<span class="label">' + link.label + "</span></a>";
        list.appendChild(li);
      });
    })
    .catch(function (err) {
      console.error(err);
    });
})();
</script>
<script src="../assets/js/android-app-links.js" defer></script>
</body>
